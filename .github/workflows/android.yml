name: Build and release APK
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md']
  workflow_dispatch:
    inputs:
      publish:
        description: '서명된 APK를 GitHub Release로 배포'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify billing rules
        run: |
          mkdir -p /tmp/water-tests
          javac -d /tmp/water-tests app/src/main/java/kr/water/calculator/Billing.java tests/BillingTest.java
          java -cp /tmp/water-tests kr.water.calculator.BillingTest
      - name: Build debug APK and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: water-calculator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD as repository secrets. See README.'
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/water-release.jks"
      - name: Build signed APK
        env:
          SIGNING_STORE: ${{ runner.temp }}/water-release.jks
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk water-calculator.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose water-calculator.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v1.0.0-build.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$release_tag" water-calculator.apk --target "$GITHUB_SHA" --title "수도계산기 $release_tag" --notes 'Android 8.0 이상. water-calculator.apk를 다운로드해 설치하세요.'
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/water-release.jks"
