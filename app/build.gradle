plugins { id 'com.android.application' }
android {
    namespace 'kr.water.calculator'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'kr.water.calculator'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (System.getenv('SIGNING_STORE')) {
                storeFile file(System.getenv('SIGNING_STORE'))
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'water-calculator'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
